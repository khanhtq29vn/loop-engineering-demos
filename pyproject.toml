[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "loop-engineering-demos"
version = "1.0.0"
description = "Reproducible loop-engineering demos: software verification and bounded ML research"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Loop Engineering Demo Contributors"}]
dependencies = []
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]

[project.scripts]
loopeng = "loopeng.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
